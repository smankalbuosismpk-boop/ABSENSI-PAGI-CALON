<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Absensi QR Code</title>
    <!-- Pustaka Scan QR Code -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ddd;
        }
        #status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background-color: #e2e3e5;
            color: #383d41;
            border: 1px solid #d6d8db;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Absensi QR Code</h2>

    <!-- Pilih Kelompok -->
    <div class="form-group">
        <label for="kelompokSelect">Pilih Kelompok:</label>
        <select id="kelompokSelect">
            <option value="">-- Pilih Kelompok Terlebih Dahulu --</option>
            <option value="Kelompok 1">Kelompok 1</option>
            <option value="Kelompok 2">Kelompok 2</option>
            <option value="Kelompok 3">Kelompok 3</option>
            <option value="Kelompok 4">Kelompok 4</option>
            <option value="Kelompok 5">Kelompok 5</option>
        </select>
    </div>

    <!-- Area Kamera QR Code -->
    <div class="form-group">
        <label>Scan QR Code Nama:</label>
        <div id="reader"></div>
    </div>

    <!-- Tampilan Status -->
    <div id="status"></div>
</div>

<script>
    // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-OcyT2C6kVUihOKAJG2P6qL0NuWfyNL-OpNOrRvD-fyHB-dTDNuEUnYx1mvHPB2gQ/exec";

    let isProcessing = false;

    function showStatus(text, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.className = type;
        statusDiv.innerText = text;
        statusDiv.style.display = 'block';
    }

    function onScanSuccess(decodedText, decodedResult) {
        if (isProcessing) return;

        const kelompok = document.getElementById('kelompokSelect').value;

        if (!kelompok) {
            alert("Harap pilih kelompok terlebih dahulu sebelum melakukan scan!");
            return;
        }

        isProcessing = true;
        showStatus("Mengirim data absensi...", "info");

        const payload = {
            nama: decodedText,
            kelompok: kelompok
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        })
        .then(() => {
            showStatus(`Berhasil Absen! Nama: ${decodedText} (${kelompok})`, "success");
            // Jeda 3 detik sebelum menerima scan berikutnya
            setTimeout(() => {
                isProcessing = false;
                document.getElementById('status').style.display = 'none';
            }, 3000);
        })
        .catch(error => {
            console.error('Error:', error);
            showStatus("Gagal mengirim data. Coba lagi.", "error");
            isProcessing = false;
        });
    }

    // Inisialisasi Kamera HTML5 QR Code Scanner
    const html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { 
            fps: 10, 
            qrbox: { width: 250, height: 250 },
            facingMode: "environment" // Menggunakan kamera belakang HP
        },
        /* verbose= */ false
    );
    
    html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
