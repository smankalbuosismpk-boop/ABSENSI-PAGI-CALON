<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Calon Pengurus - OSIS MPK SMANKALBU</title>
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Pustaka Scan QR Code -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        :root {
            /* Palette Warna Kuning & Cokelat Muda */
            --primary-brown: #5c3d2e;      /* Cokelat Tua */
            --secondary-brown: #8d5b4c;    /* Cokelat Sedang */
            --light-brown: #f5ebe0;        /* Cokelat Muda / Cream Soft Background */
            --accent-yellow: #eab308;      /* Kuning Cerah Accent */
            --dark-yellow: #ca8a04;        /* Kuning Gelap Hover */
            --card-bg: #ffffff;
            --text-main: #3d2b1f;          /* Teks Utama Cokelat Gelap */
            --text-muted: #785942;         /* Teks Muted Cokelat Medium */
            --success: #15803d;
            --danger: #b91c1c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--light-brown);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Navigation Bar */
        .navbar {
            width: 100%;
            background: linear-gradient(135deg, #4a2e1d 0%, #3d2b1f 100%);
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(92, 61, 46, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 3px solid var(--accent-yellow);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar-logo {
            width: 45px;
            height: 45px;
            background: #ffffff;
            border-radius: 50%;
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            border: 2px solid var(--accent-yellow);
            overflow: hidden;
        }

        .navbar-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .navbar-title h1 {
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.2;
            color: #ffffff;
        }

        .navbar-title p {
            font-size: 0.72rem;
            color: var(--accent-yellow);
            font-weight: 500;
        }

        .nav-badge {
            background: rgba(234, 179, 8, 0.2);
            border: 1px solid var(--accent-yellow);
            color: var(--accent-yellow);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Main Container */
        .main-container {
            width: 100%;
            max-width: 460px;
            padding: 20px;
            margin-top: 10px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(92, 61, 46, 0.08);
            border: 1px solid #e6ccb2;
        }

        .card-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .card-header h2 {
            font-size: 1.3rem;
            color: var(--primary-brown);
            font-weight: 700;
        }

        .card-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary-brown);
        }

        .select-wrapper {
            position: relative;
        }

        select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e6ccb2;
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #fdfaf6;
            appearance: none;
            outline: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        select:disabled {
            background-color: #f0f0f0;
            cursor: not-allowed;
            opacity: 0.6;
        }

        select:focus {
            border-color: var(--dark-yellow);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.2);
        }

        .select-wrapper::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary-brown);
            pointer-events: none;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-yellow);
            color: var(--primary-brown);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(234, 179, 8, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: var(--dark-yellow);
            color: #ffffff;
        }

        .btn-submit:disabled {
            background-color: #e0e0e0;
            color: #a0a0a0;
            cursor: not-allowed;
            box-shadow: none;
        }

        .scanned-info {
            padding: 10px 14px;
            background: #fdfaf6;
            border: 1px solid #e6ccb2;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary-brown);
            margin-top: 5px;
            display: none;
        }

        /* Scanner Frame */
        .scanner-container {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 2px dashed #ddb892;
            background: #fdfaf6;
        }

        #reader {
            width: 100%;
            border: none !important;
        }

        #reader video {
            object-fit: cover !important;
            border-radius: 12px;
        }

        /* Tombol html5-qrcode */
        #reader button {
            background-color: var(--accent-yellow) !important;
            color: var(--primary-brown) !important;
            border: none !important;
            padding: 10px 18px !important;
            border-radius: 8px !important;
            font-size: 0.85rem !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            margin: 10px 0 !important;
            transition: 0.2s !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1) !important;
        }

        #reader button:hover {
            background-color: var(--dark-yellow) !important;
            color: #ffffff !important;
        }

        /* Status Toast Alert */
        #status-card {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            display: none;
            align-items: center;
            gap: 12px;
            animation: slideUp 0.3s ease forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-icon {
            font-size: 1.5rem;
        }

        .status-text {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .status-success {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: var(--success);
        }

        .status-error {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: var(--danger);
        }

        .status-loading {
            background-color: #fefce8;
            border: 1px solid #fef08a;
            color: #854d0e;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: auto;
        }

        @media (max-width: 480px) {
            .navbar { padding: 12px 16px; }
            .card { padding: 20px; }
            .nav-badge { display: none; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="navbar-brand">
            <div class="navbar-logo">
                <img src="OSIS.png" alt="Logo OSIS SMAN 1 Kalibunder">
            </div>
            <div class="navbar-title">
                <h1>OSIS MPK</h1>
                <p>SMAN 1 KALIBUNDER</p>
            </div>
        </div>
        <div class="nav-badge">
            <i class="fa-solid fa-circle-check" style="margin-right: 5px;"></i> System Active
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="main-container">
        <div class="card">
            <div class="card-header">
                <h2>Absensi Calon Pengurus</h2>
                <p>Langkah 1: Scan QR Code, lalu Langkah 2: Pilih Kelompok</p>
            </div>

            <!-- LANGKAH 1: Scanner Frame -->
            <div class="form-group">
                <label><i class="fa-solid fa-qrcode" style="margin-right: 6px; color: var(--dark-yellow);"></i> 1. Scan QR Code Nama</label>
                <div class="scanner-container">
                    <div id="reader"></div>
                </div>
                <!-- Box Informasi Hasil Scan -->
                <div id="scanned-info" class="scanned-info">
                    <i class="fa-solid fa-user-check" style="color: var(--success); margin-right: 6px;"></i>
                    <span id="scanned-name-text"></span>
                </div>
            </div>

            <!-- LANGKAH 2: Pilih Kelompok -->
            <div class="form-group">
                <label for="kelompokSelect"><i class="fa-solid fa-users" style="margin-right: 6px; color: var(--dark-yellow);"></i> 2. Kelompok Calon Pengurus</label>
                <div class="select-wrapper">
                    <select id="kelompokSelect" disabled>
                        <option value="">-- Scan QR Code Terlebih Dahulu --</option>
                        <option value="KELOMPOK 1">KELOMPOK 1</option>
                        <option value="KELOMPOK 2">KELOMPOK 2</option>
                        <option value="KELOMPOK 3">KELOMPOK 3</option>
                        <option value="KELOMPOK 4">KELOMPOK 4</option>
                    </select>
                </div>
            </div>

            <!-- TOMBOL KIRIM DATA -->
            <button id="btnSubmit" class="btn-submit" disabled onclick="submitAbsensi()">
                <i class="fa-solid fa-paper-plane"></i> Kirim Absensi
            </button>

            <!-- Status Card Alert -->
            <div id="status-card">
                <div class="status-icon" id="status-icon"></div>
                <div class="status-text" id="status-text"></div>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2026 OSIS MPK SMAN 1 Kalibunder. All rights reserved.</p>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Ganti URL berikut dengan URL Web App dari Apps Script milik Anda
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzvzt4RjIxEDEN5ZrVXdwB9bRtNnxkB7HPx-ZN1LphE0eKtKMgcKbj1LcNQG0jZ0XW3/exec";

        let isProcessing = false;
        let scannedNama = ""; 
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSuccessBeep() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, ctx.currentTime);

                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {
                console.log("Audio Error: ", e);
            }
        }

        function playErrorBeep() {
            try {
                const ctx = getAudioContext();

                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = 'sawtooth';
                osc1.frequency.setValueAtTime(300, ctx.currentTime);
                gain1.gain.setValueAtTime(0.3, ctx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start();
                osc1.stop(ctx.currentTime + 0.15);

                setTimeout(() => {
                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.type = 'sawtooth';
                    osc2.frequency.setValueAtTime(220, ctx.currentTime);
                    gain2.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.start();
                    osc2.stop(ctx.currentTime + 0.2);
                }, 180);
            } catch (e) {
                console.log("Audio Error: ", e);
            }
        }

        function setStatus(message, type) {
            const card = document.getElementById('status-card');
            const icon = document.getElementById('status-icon');
            const text = document.getElementById('status-text');

            card.className = ''; 
            card.style.display = 'flex';

            if (type === 'success') {
                card.classList.add('status-success');
                icon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            } else if (type === 'error') {
                card.classList.add('status-error');
                icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            } else if (type === 'loading') {
                card.classList.add('status-loading');
                icon.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            }

            text.innerText = message;
        }

        function onScanSuccess(decodedText) {
            if (isProcessing || scannedNama === decodedText) return;

            playSuccessBeep(); 
            scannedNama = decodedText;

            const scannedInfo = document.getElementById('scanned-info');
            const scannedText = document.getElementById('scanned-name-text');
            scannedText.innerText = "Terbaca: " + decodedText;
            scannedInfo.style.display = 'block';

            const kelompokSelect = document.getElementById('kelompokSelect');
            kelompokSelect.disabled = false;
            kelompokSelect.options[0].text = "-- Sekarang Pilih Kelompok --";
            kelompokSelect.focus();

            document.getElementById('btnSubmit').disabled = false;

            setStatus("Barcode terbaca! Silakan pilih kelompok di bawah ini.", "success");
        }

        // Fungsi Ambil Koordinat GPS Pengguna
        function getLocationCoords() {
            return new Promise((resolve, reject) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            resolve({
                                lat: position.coords.latitude,
                                lng: position.coords.longitude
                            });
                        },
                        (error) => {
                            reject("GPS tidak diizinkan atau tidak aktif.");
                        },
                        { enableHighAccuracy: true, timeout: 7000, maximumAge: 0 }
                    );
                } else {
                    reject("Geolocation tidak didukung browser ini.");
                }
            });
        }

        // FUNGSI UTAMA: Kirim Data Absensi + Geofencing GPS
        async function submitAbsensi() {
            if (isProcessing) return;

            const kelompok = document.getElementById('kelompokSelect').value;

            if (!scannedNama || !kelompok) {
                playErrorBeep();
                setStatus("Lengkapi scan QR dan pilihan kelompok terlebih dahulu!", "error");
                return;
            }

            isProcessing = true;
            setStatus("Mendapatkan lokasi GPS Anda...", "loading");

            let coords;
            try {
                coords = await getLocationCoords();
            } catch (err) {
                playErrorBeep();
                setStatus("Gagal: Aktifkan GPS / Izin Lokasi di browser Anda!", "error");
                isProcessing = false;
                return;
            }

            setStatus("Verifikasi posisi & mengirim data...", "loading");

            const payload = {
                nama: scannedNama,
                kelompok: kelompok,
                lat: coords.lat,
                lng: coords.lng
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    playSuccessBeep();
                    setStatus(data.message, "success");
                    setTimeout(() => { resetForm(); }, 3500);
                } else {
                    playErrorBeep();
                    setStatus(data.message, "error");
                    isProcessing = false;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                playErrorBeep();
                setStatus("Gagal terhubung ke server absensi.", "error");
                isProcessing = false;
            });
        }

        function resetForm() {
            isProcessing = false;
            scannedNama = "";
            
            document.getElementById('scanned-info').style.display = 'none';
            document.getElementById('status-card').style.display = 'none';
            
            const kelompokSelect = document.getElementById('kelompokSelect');
            kelompokSelect.value = "";
            kelompokSelect.disabled = true;
            kelompokSelect.options[0].text = "-- Scan QR Code Terlebih Dahulu --";

            document.getElementById('btnSubmit').disabled = true;
        }

        // Inisialisasi Scanner QR
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 15, 
                qrbox: { width: 220, height: 220 },
                facingMode: "environment" 
            },
            false
        );
        
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
